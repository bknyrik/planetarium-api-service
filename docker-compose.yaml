services:
  postgres_db:
    image: postgres:18.3-alpine
    container_name: postgres_db
    env_file:
      .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    env_file:
      .env
    ports:
      - "5050:80"

volumes:
  pg_data:
